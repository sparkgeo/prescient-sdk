name: deploy-book

# Run this when a new release tag is pushed.
# Final tags deploy to the site root; pre-release tags (a/b/rc) deploy to /dev/.
on:
  push:
    tags: ['*.*.*', 'v*.*.*']
  # Manual run: from main it refreshes the root site, from any other branch it
  # refreshes /dev/ — neither needs a tag.
  workflow_dispatch:

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Choose destination
      id: dest
      run: |
        set -e
        REF="${GITHUB_REF_NAME}"
        if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
          if [[ "$REF" == "main" ]]; then
            echo "Manual run from main — deploying to the site root."
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            echo "Manual run from '$REF' — deploying to /dev/."
            echo "dir=dev" >> "$GITHUB_OUTPUT"
          fi
        elif [[ "$REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)\.[0-9]+$ ]]; then
          echo "Pre-release tag '$REF' — deploying to /dev/."
          echo "dir=dev" >> "$GITHUB_OUTPUT"
        elif git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "Final release tag '$REF' is on main — deploying to the site root."
          echo "dir=" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Final release tag '$REF' must be created from a commit on main to deploy the book. Use a pre-release suffix (a/b/rc, e.g. v1.2.3rc.1) to deploy to /dev/."
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "0.9.7"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install the project
      run: uv sync --all-extras --group dev

    - name: cache executed notebooks
      uses: actions/cache@v3
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('uv.lock') }}

    # Build the book
    - name: Build the book
      run: |
        uv run jupyter-book build docs/

    # Deploy the book's HTML to the gh-pages branch.
    # ponytail: keep_files stops a root deploy wiping /dev/, at the cost of
    # never removing deleted pages. Delete stale files by hand on gh-pages, or
    # split stable/dev into two branches if that ever becomes a real problem.
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html
        destination_dir: ${{ steps.dest.outputs.dir }}
        keep_files: true
        full_commit_message: "docs: deploy ${{ github.ref_name }}"
